name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: ver
        run: |
          VERSION=$(grep '^horizoncam.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HorizonCam-$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/HorizonCam-$VERSION.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HorizonCam-apks
          path: dist/*.apk

      # Every push to main publishes (or refreshes) a pre-release named after the app version,
      # so testers can grab the APK straight from the Releases page on their phone.
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: HorizonCam ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk

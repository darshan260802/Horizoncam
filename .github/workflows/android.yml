name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        id: ver
        run: |
          VERSION=$(grep '^horizoncam.versionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/HorizonCam-$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/HorizonCam-$VERSION.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HorizonCam-apks
          path: dist/*.apk

      # A push to main that bumps horizoncam.versionName publishes a new pre-release,
      # so testers can grab the APK straight from the Releases page on their phone.
      - name: Check for existing release
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        run: |
          awk -v v="## ${{ steps.ver.outputs.name }}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HorizonCam ${{ steps.ver.outputs.name }}" > notes.md
          printf '\n**Install:** download `HorizonCam-%s-debug.apk` below on your phone and open it.\n' "${{ steps.ver.outputs.name }}" >> notes.md

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          tag_name: v${{ steps.ver.outputs.name }}
          name: HorizonCam ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
